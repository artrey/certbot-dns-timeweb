[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "certbot-dns-timeweb"
version = "2.0.0"
description = "Timeweb Cloud DNS Authenticator plugin for Certbot"
authors = [{ name = "Aleksandr Ivanov", email = "oz.sasha.ivanov@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["certbot", "letsencrypt", "dns", "dns-01", "timeweb", "timeweb-cloud", "acme"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Plugins",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "certbot>=2.8",
  "requests>=2.25.1",
]

[project.urls]
Homepage = "https://github.com/artrey/certbot-dns-timeweb"
Repository = "https://github.com/artrey/certbot-dns-timeweb"
Issues = "https://github.com/artrey/certbot-dns-timeweb/issues"
Changelog = "https://github.com/artrey/certbot-dns-timeweb/blob/master/CHANGELOG.md"

[project.entry-points."certbot.plugins"]
dns-timeweb = "certbot_dns_timeweb.authenticator:Authenticator"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.14",
]

[tool.poetry]
packages = [{ include = "certbot_dns_timeweb" }]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "venv", "dist", "build", "data"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["certbot_dns_timeweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["--strict-markers", "--tb=short"]
filterwarnings = ["error", "ignore::ImportWarning:importlib"]

[tool.coverage.run]
source = ["certbot_dns_timeweb"]
